# /etc/bc250-cpu-online.conf — APIC IDs to keep offline when the core mask is 0xFF.
# Under 0xFF, physical core N = APIC IDs 2N and 2N+1 (= logical cpu 2N, 2N+1).
# Find your bad core(s) with bc250-core-test (see README) — do NOT guess.
# Example: core 5 defective -> PARKED_APICS="10 11". All 8 cores good -> PARKED_APICS=none
PARKED_APICS=
