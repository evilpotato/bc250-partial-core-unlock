# BC-250 CoreUnlock + ACPI fix — https://github.com/evilpotato/bc250-partial-core-unlock
# Sourced from the static grub.cfg pre-stage, i.e. before greenboot's boot counter, so the
# shim's warm reset doesn't count as an extra boot. On the factory mask the shim writes 0xFF
# and warm-resets (at most once per power-on, NVRAM-guarded); on 0xFF it returns immediately.
# Skip from Linux: sudo grub2-editenv - set bc250_skip_unlock=1
# Diagnostics: bc250_grub in grubenv = how far this hook got on the last boot.
if [ "$grub_platform" = "efi" -a "$bc250_skip_unlock" != "1" ]; then
  if search --no-floppy --fs-uuid @ESP_UUID@ --set bc250_esp; then
    set bc250_grub=chainloading
    save_env bc250_grub
    if chainloader ($bc250_esp)/EFI/bc250/COREUNLOCK.EFI; then
      boot
      set bc250_grub=returned
    else
      set bc250_grub=chainloader-failed
    fi
  else
    set bc250_grub=esp-not-found
  fi
  save_env bc250_grub
fi

# BC-250 ACPI fix: early cpio with SSDT-CST/SSDT-PST (mendesrr/bc250-acpi-fix-updated-8c, built from
# its reviewed .dsl) adding _CST/_PSS to \_PR.P000-P00F; the firmware's own CPU SSDT targets the
# nonexistent \_PR.C0xx and fails to load. blscfg resolves early_initrd relative to the ostree
# deployment dir, hence ../../ = root of /boot. Skip: sudo grub2-editenv - set bc250_skip_acpi=1
if [ "$bc250_skip_acpi" != "1" -a -f /bc250-acpi.cpio ]; then
  set early_initrd="../../bc250-acpi.cpio"
fi
